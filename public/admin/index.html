<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ניהול מאגר מטפלי POET</title>
    <meta name="description" content="ניהול מאגר מטפלי POET">
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
  </head>
  <body class="poet-admin-shell">
    <div id="app">
      <section id="login-screen" class="screen visible" aria-live="polite">
        <div class="admin-panel login-panel">
          <div class="admin-brand">
            <img src="https://frisch-ot.com/wp-content/uploads/2021/10/POET-logoR-72dpi.png" alt="POET">
          </div>
          <h1>ניהול מאגר מטפלי POET</h1>
          <form id="login-form" novalidate>
            <label>
              <span>אימייל</span>
              <input type="email" id="email" name="email" autocomplete="email" required>
            </label>
            <label>
              <span>סיסמה</span>
              <input type="password" id="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit" class="primary-button">התחברות</button>
          </form>
          <p id="login-message" class="message" aria-live="polite"></p>
        </div>
      </section>

      <section id="dashboard-screen" class="screen" aria-live="polite">
        <header class="admin-header">
          <div>
            <p class="eyebrow">ניהול</p>
            <h1>מאגר מטפלי POET</h1>
          </div>
          <button type="button" id="logout-button" class="secondary-button">יציאה</button>
        </header>

        <main class="admin-main">
          <div id="dashboard-notification" class="dashboard-notification" hidden></div>

          <div class="toolbar">
            <button type="button" id="add-therapist-button" class="primary-button">הוספת מרפא/ה</button>
          </div>

          <section class="list-panel">
            <div class="list-header">
              <h2>רשימת מטפלים</h2>
            </div>
            <div id="therapist-list" class="therapist-list" aria-live="polite">
              <div class="empty-state">טוען רשימת מטפלים…</div>
            </div>
          </section>
        </main>
      </section>
    </div>

    <div id="therapist-modal" class="modal" aria-hidden="true" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="therapist-modal-title">
        <div class="modal-header">
          <h2 id="therapist-modal-title">הוספת מטפלת</h2>
          <button type="button" id="close-modal-button" class="close-modal-button" aria-label="סגור">×</button>
        </div>

        <form id="therapist-form" novalidate>
          <div class="form-grid">
            <label class="full-width">
              <span>שם</span>
              <input type="text" id="therapist-name" name="name" required>
            </label>

            <label>
              <span>כותרת יישוב</span>
              <input type="text" id="therapist-settlement-label" name="settlement_label">
            </label>

            <label>
              <span>יישובים</span>
              <input type="text" id="therapist-settlements" name="settlements" placeholder="למשל: רמת גן, גבעתיים">
            </label>

            <label>
              <span>אזורים</span>
              <input type="text" id="therapist-regions" name="regions" placeholder="למשל: north, center">
            </label>

            <label>
              <span>תיוגי אזורים</span>
              <input type="text" id="therapist-region-labels" name="region_labels" placeholder="למשל: צפון, מרכז">
            </label>

            <label>
              <span>גיל מינימום</span>
              <input type="number" id="therapist-age-min" name="age_min" min="0" step="1">
            </label>

            <label>
              <span>גיל מקסימום</span>
              <input type="number" id="therapist-age-max" name="age_max" min="0" step="1">
            </label>

            <label>
              <span>טקסט גילאים</span>
              <input type="text" id="therapist-age-label" name="age_label" placeholder="למשל: 0–6">
            </label>

            <label class="checkbox-row full-width">
              <input type="checkbox" id="therapist-age-open-ended" name="age_open_ended">
              <span>גיל ללא הגבלה</span>
            </label>

            <label>
              <span>טלפונים</span>
              <input type="text" id="therapist-phones" name="phones" placeholder="למשל: 050-0000000, 03-0000000">
            </label>

            <label>
              <span>אימיילים</span>
              <input type="text" id="therapist-emails" name="emails" placeholder="למשל: mail@example.com, second@example.com">
            </label>

            <label>
              <span>שפות</span>
              <input type="text" id="therapist-languages" name="languages" placeholder="למשל: hebrew, arabic">
            </label>

            <label>
              <span>תיוגי שפות</span>
              <input type="text" id="therapist-language-labels" name="language_labels" placeholder="למשל: עברית, ערבית">
            </label>

            <label>
              <span>קרנות</span>
              <input type="text" id="therapist-funds" name="funds" placeholder="למשל: maccabi, clalit">
            </label>

            <label>
              <span>תיוגי קרנות</span>
              <input type="text" id="therapist-fund-labels" name="fund_labels" placeholder="למשל: מכבי, כללית">
            </label>

            <label class="checkbox-row">
              <input type="checkbox" id="therapist-online" name="online">
              <span>טיפול מקוון</span>
            </label>

            <label class="checkbox-row">
              <input type="checkbox" id="therapist-in-person" name="in_person">
              <span>טיפול פנים אל פנים</span>
            </label>
          </div>

          <div id="therapist-form-error" class="form-error" aria-live="polite" hidden></div>

          <div class="modal-actions">
            <button type="button" id="cancel-therapist-button" class="secondary-button">ביטול</button>
            <button type="submit" class="primary-button">שמירה</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="js/admin.js"></script>
  </body>
</html>
